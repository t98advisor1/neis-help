<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://cdn.jsdelivr.net/gh/sun-typeface/SUIT@2/fonts/variable/woff2/SUIT-Variable.css');
      text { font-family: 'SUIT', 'Pretendard', 'Malgun Gothic', -apple-system, sans-serif; letter-spacing: -0.02em; }
      .title { font-size: 20px; font-weight: 800; fill: #0f172a; }
      .badge-step { font-size: 12px; font-weight: 800; fill: #ffffff; }
      .code-txt { font-family: Consolas, Monaco, monospace; font-size: 12px; fill: #334155; }
      .callout { font-size: 13.5px; font-weight: 800; fill: #ffffff; }
    </style>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#000" flood-opacity="0.12"/>
    </filter>
    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#dc2626" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="960" height="540" fill="#f8fafc" rx="12"/>

  <!-- Top Title Bar -->
  <rect x="24" y="16" width="76" height="24" rx="12" fill="#7c3aed"/>
  <text x="62" y="32" text-anchor="middle" class="badge-step">STEP 3</text>
  <text x="110" y="34" class="title">3단계: 기존 코드 전체 삭제(Ctrl+A ➔ Del) 후 코드 붙여넣기 &amp; 💾 저장</text>

  <!-- Browser Frame -->
  <g transform="translate(24, 52)" filter="url(#shadow)">
    <rect width="912" height="464" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <path d="M 0 10 Q 0 0 10 0 L 902 0 Q 912 0 912 10 L 912 36 L 0 36 Z" fill="#e2e8f0"/>
    <path d="M 12 36 L 22 10 Q 25 6 32 6 L 240 6 Q 247 6 250 10 L 260 36 Z" fill="#ffffff"/>
    <circle cx="34" cy="21" r="5" fill="#3b82f6"/>
    <text x="46" y="25" font-size="12" font-weight="600" fill="#334155">Apps Script - 무제 프로젝트</text>

    <!-- Apps Script Toolbar -->
    <rect x="0" y="36" width="912" height="48" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="24" y="65" font-size="15" font-weight="800" fill="#1e293b">코드.gs</text>

    <!-- Save Disk Button (Highlighted) -->
    <g transform="translate(110, 46)">
      <rect width="70" height="28" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
      <text x="12" y="19" font-size="13">💾</text>
      <text x="32" y="18" font-size="12" font-weight="800" fill="#15803d">저장</text>
    </g>

    <!-- Run & Deploy buttons -->
    <rect x="190" y="46" width="56" height="28" rx="6" fill="#f1f5f9"/>
    <text x="206" y="65" font-size="12" fill="#64748b">실행</text>

    <!-- Deploy Blue Button -->
    <g transform="translate(800, 44)">
      <rect width="88" height="32" rx="6" fill="#2563eb" filter="url(#shadow)"/>
      <text x="44" y="21" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff">배포 ▾</text>
    </g>

    <!-- Editor Body -->
    <rect x="0" y="84" width="912" height="380" fill="#1e1e2e"/>
    
    <!-- Code line numbers -->
    <g transform="translate(10, 110)" font-family="Consolas" font-size="11" fill="#6c7086">
      <text x="10" y="0">1</text>
      <text x="10" y="22">2</text>
      <text x="10" y="44">3</text>
      <text x="10" y="66">4</text>
      <text x="10" y="88">5</text>
      <text x="10" y="110">6</text>
      <text x="10" y="132">7</text>
      <text x="10" y="154">8</text>
      <text x="10" y="176">9</text>
      <text x="10" y="198">10</text>
    </g>

    <!-- Code Text -->
    <g transform="translate(50, 110)" font-family="Consolas, monospace" font-size="12">
      <text x="0" y="0" fill="#6c7086">/** 2026 학교생활기록부 올인원 통합 Apps Script (math-tong) */</text>
      <text x="0" y="22" fill="#cba6f7">function <tspan fill="#89b4fa">NEIS_BYTE</tspan>(<tspan fill="#f9e2af">text</tspan>) {</text>
      <text x="20" y="44" fill="#6c7086">// 나이스 3-Byte 정밀 글자수 계산 함수</text>
      <text x="20" y="66" fill="#cba6f7">return <tspan fill="#89dceb">getNeisByte</tspan>(text);</text>
      <text x="0" y="88" fill="#cba6f7">}</text>
      <text x="0" y="120" fill="#cba6f7">function <tspan fill="#89b4fa">AI_SETUK</tspan>(<tspan fill="#f9e2af">subject, activity, competency</tspan>) {</text>
      <text x="20" y="142" fill="#6c7086">// Gemini 1.5 Flash 1,500 Byte 자동 완성 수식</text>
      <text x="20" y="164" fill="#cba6f7">return <tspan fill="#a6e3a1">"농도 차이에 따른 삼투압 원리를 실험을 통해 규명함..."</tspan>;</text>
      <text x="0" y="186" fill="#cba6f7">}</text>
    </g>

    <!-- Callout on Save Button -->
    <g transform="translate(190, 42)" filter="url(#badgeShadow)">
      <rect width="250" height="34" rx="6" fill="#dc2626"/>
      <polygon points="0,17 -10,22 -10,12" fill="#dc2626"/>
      <text x="125" y="22" text-anchor="middle" class="callout">👆 붙여넣기 후 💾 [저장] 클릭!</text>
    </g>
  </g>
</svg>