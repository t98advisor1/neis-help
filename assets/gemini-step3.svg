<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://cdn.jsdelivr.net/gh/sun-typeface/SUIT@2/fonts/variable/woff2/SUIT-Variable.css');
      text { font-family: 'SUIT', 'Pretendard', 'Malgun Gothic', -apple-system, sans-serif; letter-spacing: -0.02em; }
      .title { font-size: 20px; font-weight: 800; fill: #0f172a; }
      .desc { font-size: 13.5px; fill: #475569; }
      .badge-step { font-size: 12px; font-weight: 700; fill: #ffffff; }
      .url-bar { font-size: 12px; font-family: Consolas, monospace; fill: #1e293b; }
      .callout-txt { font-size: 14px; font-weight: 800; fill: #ffffff; }
    </style>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#000" flood-opacity="0.12"/>
    </filter>
    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#dc2626" flood-opacity="0.35"/>
    </filter>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="960" height="540" fill="#f1f5f9" rx="12"/>

  <!-- Top Title Bar -->
  <rect x="24" y="16" width="76" height="24" rx="12" fill="#2563eb"/>
  <text x="62" y="32" text-anchor="middle" class="badge-step">STEP 3</text>
  <text x="110" y="34" class="title">3단계: [Create API key] 파란색 버튼 클릭</text>

  <!-- Chrome Browser Window Frame -->
  <g transform="translate(24, 52)" filter="url(#shadow)">
    <!-- Window Body -->
    <rect width="912" height="464" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>

    <!-- Title Bar -->
    <path d="M 0 10 Q 0 0 10 0 L 902 0 Q 912 0 912 10 L 912 36 L 0 36 Z" fill="#e2e8f0"/>
    <!-- Chrome Tab -->
    <path d="M 12 36 L 22 10 Q 25 6 32 6 L 210 6 Q 217 6 220 10 L 230 36 Z" fill="#ffffff"/>
    <circle cx="34" cy="21" r="5" fill="#3b82f6"/>
    <text x="46" y="25" font-size="12" font-weight="600" fill="#334155">Google AI Studio</text>
    <text x="206" y="24" font-size="11" fill="#94a3b8">✕</text>

    <!-- Window Controls (Win11) -->
    <g transform="translate(840, 12)">
      <line x1="0" y1="6" x2="10" y2="6" stroke="#64748b" stroke-width="1.2"/>
      <rect x="22" y="1" width="9" height="9" fill="none" stroke="#64748b" stroke-width="1.2"/>
      <path d="M 44 1 L 53 10 M 53 1 L 44 10" stroke="#64748b" stroke-width="1.2"/>
    </g>

    <!-- Address Bar -->
    <rect y="36" width="912" height="34" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <path d="M 16 53 L 23 47 M 16 53 L 23 59" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M 33 53 L 26 47 M 33 53 L 26 59" stroke="#cbd5e1" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="50" cy="53" r="5" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="68" y="41" width="828" height="24" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="82" y="57" class="url-bar">🔒 https://aistudio.google.com/apikey</text>

    <!-- Inner Web Content -->
    
    <!-- AI Studio Dashboard Layout -->
    <!-- Left Sidebar -->
    <rect y="70" width="180" height="394" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    
    <!-- Sidebar Items -->
    <g transform="translate(16, 92)">
      <circle cx="12" cy="12" r="8" fill="#3b82f6"/>
      <text x="28" y="16" font-size="13" font-weight="700" fill="#0f172a">AI Studio</text>
    </g>
    <g transform="translate(16, 135)">
      <text x="12" y="16" font-size="12.5" fill="#64748b">💬 Prompts</text>
      <text x="12" y="46" font-size="12.5" fill="#64748b">⚙️ Tune models</text>
      <rect x="0" y="65" width="156" height="34" rx="6" fill="#eff6ff"/>
      <text x="12" y="87" font-size="13" font-weight="700" fill="#2563eb">🔑 API keys</text>
      <text x="12" y="127" font-size="12.5" fill="#64748b">📊 Usage &amp; limits</text>
      <text x="12" y="157" font-size="12.5" fill="#64748b">📚 Documentation</text>
    </g>

    <!-- Main Content Area -->
    <g transform="translate(210, 92)">
      <!-- Top Title and Create Key Button -->
      <text x="0" y="26" font-size="22" font-weight="800" fill="#0f172a">API keys</text>
      <text x="0" y="48" font-size="12.5" fill="#64748b">Google AI Studio API를 호출하기 위한 고유 인증 키를 관리합니다.</text>

      <!-- Blue Button: + Create API key -->
      <g id="btnCreateKey">
        <rect x="490" y="4" width="180" height="42" rx="8" fill="#2563eb"/>
        <text x="580" y="30" text-anchor="middle" font-size="14.5" font-weight="700" fill="#ffffff">+ Create API key</text>
      </g>

      <!-- Table Header -->
      <rect x="0" y="80" width="670" height="36" rx="6" fill="#f1f5f9"/>
      <text x="16" y="103" font-size="12" font-weight="700" fill="#475569">Key Name</text>
      <text x="210" y="103" font-size="12" font-weight="700" fill="#475569">API Key</text>
      <text x="440" y="103" font-size="12" font-weight="700" fill="#475569">Created</text>
      <text x="580" y="103" font-size="12" font-weight="700" fill="#475569">Actions</text>

      <!-- Empty state or dummy row -->
      <rect x="0" y="124" width="670" height="60" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="16" y="159" font-size="13" font-weight="600" fill="#0f172a">Default Project Key</text>
      <text x="210" y="159" font-size="12.5" fill="#64748b" font-family="Consolas, monospace">AIzaSyB*******************</text>
      <text x="440" y="159" font-size="12" fill="#64748b">방금 전</text>
      <rect x="576" y="142" width="60" height="28" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
      <text x="606" y="161" text-anchor="middle" font-size="11.5" fill="#334155">Copy</text>
    </g>

    <!-- RED HIGHLIGHT BOX around [+ Create API key] -->
    <rect x="690" y="90" width="198" height="54" rx="10" fill="rgba(220, 38, 38, 0.08)" stroke="#dc2626" stroke-width="3.5" filter="url(#redGlow)"/>

    <!-- CURVED ARROW pointing down-left to [+ Create API key] -->
    <path d="M 830 220 Q 860 170 825 150" fill="none" stroke="#dc2626" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrowRed)"/>

    <!-- Callout Badge -->
    <g transform="translate(680, 220)" filter="url(#badgeShadow)">
      <rect width="210" height="52" rx="8" fill="#dc2626"/>
      <text x="105" y="24" text-anchor="middle" class="callout-txt">[+ Create API key] 클릭</text>
      <text x="105" y="42" text-anchor="middle" font-size="11.5" fill="#fecaca">여기를 눌러 새 키 생성을 시작합니다</text>
    </g>

  </g>
</svg>
