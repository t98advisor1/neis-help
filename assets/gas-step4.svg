<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://cdn.jsdelivr.net/gh/sun-typeface/SUIT@2/fonts/variable/woff2/SUIT-Variable.css');
      text { font-family: 'SUIT', 'Pretendard', 'Malgun Gothic', -apple-system, sans-serif; letter-spacing: -0.02em; }
      .title { font-size: 20px; font-weight: 800; fill: #0f172a; }
      .badge-step { font-size: 12px; font-weight: 800; fill: #ffffff; }
      .callout { font-size: 13.5px; font-weight: 800; fill: #ffffff; }
    </style>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#000" flood-opacity="0.12"/>
    </filter>
    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#dc2626" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="960" height="540" fill="#f8fafc" rx="12"/>

  <!-- Top Title Bar -->
  <rect x="24" y="16" width="76" height="24" rx="12" fill="#ea580c"/>
  <text x="62" y="32" text-anchor="middle" class="badge-step">STEP 4</text>
  <text x="110" y="34" class="title">4단계: 우측 상단 [배포] ➔ [새 배포] ➔ [웹 앱 (액세스: 모든 사용자)]</text>

  <!-- Browser Frame -->
  <g transform="translate(24, 52)" filter="url(#shadow)">
    <rect width="912" height="464" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <path d="M 0 10 Q 0 0 10 0 L 902 0 Q 912 0 912 10 L 912 36 L 0 36 Z" fill="#e2e8f0"/>
    
    <!-- Deployment Dialog Modal Center -->
    <rect x="0" y="36" width="912" height="428" fill="rgba(15, 23, 42, 0.45)"/>

    <g transform="translate(196, 60)" filter="url(#shadow)">
      <rect width="520" height="380" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="24" y="34" font-size="18" font-weight="800" fill="#0f172a">새 배포</text>
      
      <!-- Type Select -->
      <g transform="translate(24, 54)">
        <rect width="472" height="40" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
        <text x="14" y="25" font-size="13" font-weight="700" fill="#0f172a">유형 선택: 웹 앱 (Web app)</text>
        <circle cx="440" cy="20" r="4" fill="#059669"/>
      </g>

      <!-- Config 1: Execute as -->
      <text x="24" y="120" font-size="13" font-weight="700" fill="#334155">다음 사용자로 실행</text>
      <rect x="24" y="130" width="472" height="38" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="36" y="154" font-size="13" fill="#0f172a">나 (teacher@gmail.com)</text>

      <!-- Config 2: Access (VERY IMPORTANT!) -->
      <text x="24" y="196" font-size="13" font-weight="800" fill="#dc2626">액세스 권한 있는 사용자 (중요!)</text>
      <g transform="translate(24, 206)">
        <rect width="472" height="42" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
        <text x="14" y="26" font-size="14" font-weight="800" fill="#b91c1c">모든 사용자 (Anyone)</text>
        <text x="440" y="26" font-size="14">▾</text>
      </g>
      <text x="24" y="266" font-size="11.5" fill="#64748b">* '모든 사용자'로 설정해야 교사 개인 브라우저에서 시트로 데이터가 자동 전송됩니다.</text>

      <!-- Deploy Button -->
      <g transform="translate(376, 320)">
        <rect width="120" height="40" rx="8" fill="#2563eb" filter="url(#shadow)"/>
        <text x="60" y="25" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">배포</text>
      </g>
    </g>

    <!-- Callout -->
    <g transform="translate(480, 260)" filter="url(#badgeShadow)">
      <rect width="320" height="34" rx="6" fill="#dc2626"/>
      <polygon points="120,0 130,-10 140,0" fill="#dc2626"/>
      <text x="160" y="22" text-anchor="middle" class="callout">👆 반드시 '모든 사용자'를 선택하세요!</text>
    </g>
  </g>
</svg>