<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="shadow1" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="800" height="450" fill="url(#bg1)"/>
  <!-- Google Sheet UI Window -->
  <g transform="translate(60, 40)" filter="url(#shadow1)">
    <rect width="680" height="370" rx="12" fill="#ffffff"/>
    <!-- Title Bar -->
    <rect width="680" height="44" rx="12" fill="#f1f5f9"/>
    <circle cx="24" cy="22" r="6" fill="#ef4444"/>
    <circle cx="42" cy="22" r="6" fill="#f59e0b"/>
    <circle cx="60" cy="22" r="6" fill="#10b981"/>
    <text x="80" y="27" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#334155">2026_관계형_학교생활기록부_마스터시트 - Google Sheets</text>
    <!-- Menu Bar -->
    <rect x="0" y="44" width="680" height="34" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <text x="24" y="66" font-family="-apple-system, sans-serif" font-size="12" fill="#64748b">파일</text>
    <text x="64" y="66" font-family="-apple-system, sans-serif" font-size="12" fill="#64748b">수정</text>
    <text x="104" y="66" font-family="-apple-system, sans-serif" font-size="12" fill="#64748b">보기</text>
    <text x="144" y="66" font-family="-apple-system, sans-serif" font-size="12" fill="#64748b">삽입</text>
    <text x="184" y="66" font-family="-apple-system, sans-serif" font-size="12" fill="#64748b">서식</text>
    <text x="224" y="66" font-family="-apple-system, sans-serif" font-size="12" fill="#64748b">데이터</text>
    <text x="274" y="66" font-family="-apple-system, sans-serif" font-size="12" fill="#64748b">도구</text>
    <!-- Highlight: 확장 프로그램 -->
    <rect x="310" y="49" width="95" height="24" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="318" y="66" font-family="-apple-system, sans-serif" font-size="12" font-weight="800" fill="#1d4ed8">확장 프로그램</text>
    <text x="418" y="66" font-family="-apple-system, sans-serif" font-size="12" fill="#64748b">도움말</text>
    <!-- Dropdown Menu -->
    <g transform="translate(310, 78)" filter="url(#shadow1)">
      <rect width="180" height="120" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="16" y="30" font-family="-apple-system, sans-serif" font-size="13" fill="#64748b">부가기능</text>
      <!-- Highlight: Apps Script -->
      <rect x="6" y="42" width="168" height="34" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
      <text x="16" y="64" font-family="-apple-system, sans-serif" font-size="13.5" font-weight="800" fill="#1e40af">⚡ Apps Script</text>
      <text x="16" y="100" font-family="-apple-system, sans-serif" font-size="13" fill="#64748b">AppSheet</text>
    </g>
    <!-- Sheet Grid Mock -->
    <rect x="20" y="210" width="640" height="140" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
    <line x1="20" y1="245" x2="660" y2="245" stroke="#cbd5e1"/>
    <line x1="20" y1="280" x2="660" y2="280" stroke="#e2e8f0"/>
    <line x1="20" y1="315" x2="660" y2="315" stroke="#e2e8f0"/>
    <line x1="120" y1="210" x2="120" y2="350" stroke="#cbd5e1"/>
    <line x1="220" y1="210" x2="220" y2="350" stroke="#cbd5e1"/>
    <line x1="380" y1="210" x2="380" y2="350" stroke="#cbd5e1"/>
    <text x="40" y="232" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#475569">A (학번)</text>
    <text x="140" y="232" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#475569">B (성명)</text>
    <text x="240" y="232" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#475569">C (희망학과)</text>
    <text x="420" y="232" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#475569">D (세특 초안 =AI_SETUK)</text>
  </g>
  <!-- Step Badge -->
  <g transform="translate(60, 415)">
    <rect width="680" height="30" rx="6" fill="#2563eb"/>
    <text x="340" y="20" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" font-weight="800" fill="#ffffff">1단계: 상단 메뉴 [확장 프로그램] ➔ [Apps Script] 클릭</text>
  </g>
</svg>