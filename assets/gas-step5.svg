<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="shadow5" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="800" height="450" fill="url(#bg5)"/>
  <!-- Formula in Sheet Window -->
  <g transform="translate(60, 40)" filter="url(#shadow5)">
    <rect width="680" height="370" rx="12" fill="#ffffff"/>
    <!-- Title Bar -->
    <rect width="680" height="44" rx="12" fill="#f1f5f9"/>
    <text x="30" y="27" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#334155">구글 시트 셀 안에서 =AI_SETUK() 수식 사용 결과</text>
    <!-- Formula Input Bar -->
    <rect x="0" y="44" width="680" height="36" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="20" y="68" font-family="Courier New, monospace" font-size="13" font-weight="700" fill="#ef4444">fx</text>
    <rect x="50" y="49" width="610" height="26" rx="4" fill="#eff6ff" stroke="#3b82f6"/>
    <text x="60" y="67" font-family="Courier New, monospace" font-size="12.5" font-weight="700" fill="#1d4ed8">=AI_SETUK(D2, "고려대 생명공학", "생명공학과", "생명과학Ⅰ")</text>
    <!-- Result Card in Cell -->
    <g transform="translate(20, 100)">
      <rect width="640" height="230" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
      <text x="24" y="34" font-family="-apple-system, sans-serif" font-size="14" font-weight="800" fill="#15803d">✅ AI 세특 초안 자동 완성 결과 (나이스 글자수 420 Byte / 1,500 Byte 준수):</text>
      <rect x="24" y="50" width="592" height="110" rx="6" fill="#ffffff" stroke="#bbf7d0"/>
      <text x="40" y="78" font-family="-apple-system, sans-serif" font-size="12.5" fill="#1e293b">"삼투현상과 세포막 선택적 투과성을 탐구하고자 농도에 따른 원형질 분리 현상을 현미경으로</text>
      <text x="40" y="102" font-family="-apple-system, sans-serif" font-size="12.5" fill="#1e293b">정밀 관찰함. 선택적 투과 원리를 세포막 인지질 이중층 구조와 논리적으로 연결하여 규명하고,</text>
      <text x="40" y="126" font-family="-apple-system, sans-serif" font-size="12.5" fill="#1e293b">바이오 신약 기술의 최신 동향을 조사하여 생명윤리적 시각에서 균형 있게 분석함."</text>
      <text x="24" y="190" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#047857">📊 =NEIS_BYTE(E2) ➔ 실시간 420 Byte 자동 검증 완료 (엔터 2B, 한글 3B)</text>
      <text x="24" y="215" font-family="-apple-system, sans-serif" font-size="12" fill="#64748b">※ 드래그하여 전교생 30명~200명에게 아래로 채우면 1초 만에 전원 완성됩니다!</text>
    </g>
  </g>
  <!-- Step Badge -->
  <g transform="translate(60, 415)">
    <rect width="680" height="30" rx="6" fill="#2563eb"/>
    <text x="340" y="20" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" font-weight="800" fill="#ffffff">5단계: 구글 시트 셀에서 =AI_SETUK() 수식으로 전교생 세특 1초 완성!</text>
  </g>
</svg>