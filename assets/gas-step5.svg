<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://cdn.jsdelivr.net/gh/sun-typeface/SUIT@2/fonts/variable/woff2/SUIT-Variable.css');
      text { font-family: 'SUIT', 'Pretendard', 'Malgun Gothic', -apple-system, sans-serif; letter-spacing: -0.02em; }
      .title { font-size: 20px; font-weight: 800; fill: #0f172a; }
      .badge-step { font-size: 12px; font-weight: 800; fill: #ffffff; }
      .callout { font-size: 13.5px; font-weight: 800; fill: #ffffff; }
    </style>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#000" flood-opacity="0.12"/>
    </filter>
    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#dc2626" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="960" height="540" fill="#f8fafc" rx="12"/>

  <!-- Top Title Bar -->
  <rect x="24" y="16" width="76" height="24" rx="12" fill="#dc2626"/>
  <text x="62" y="32" text-anchor="middle" class="badge-step">STEP 5</text>
  <text x="110" y="34" class="title">5단계: 최초 1회 Google 계정 승인 (고급 ➔ 안전하지 않음 이동 ➔ 허용)</text>

  <!-- Browser Frame -->
  <g transform="translate(24, 52)" filter="url(#shadow)">
    <rect width="912" height="464" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <path d="M 0 10 Q 0 0 10 0 L 902 0 Q 912 0 912 10 L 912 36 L 0 36 Z" fill="#e2e8f0"/>
    
    <!-- Google OAuth Warning Dialog Box -->
    <rect x="0" y="36" width="912" height="428" fill="#f8fafc"/>

    <g transform="translate(206, 60)" filter="url(#shadow)">
      <rect width="500" height="380" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
      
      <!-- Warning Icon -->
      <path d="M 40 40 L 55 68 L 25 68 Z" fill="#f59e0b"/>
      <text x="40" y="64" text-anchor="middle" font-size="15" font-weight="900" fill="#ffffff">!</text>
      
      <text x="70" y="58" font-size="18" font-weight="800" fill="#0f172a">Google에서 확인하지 않은 앱입니다</text>
      <text x="36" y="100" font-size="13" fill="#64748b" line-height="1.5">
        선생님 본인이 직접 생성한 스크립트이므로 Google 보안 알림이 뜹니다.
      </text>

      <!-- Advanced Button (Highlighted) -->
      <g transform="translate(36, 140)">
        <rect width="110" height="32" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
        <text x="55" y="21" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">고급 (Advanced)</text>
      </g>

      <!-- Sub link (Unsafe) -->
      <g transform="translate(36, 190)">
        <rect width="280" height="34" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
        <text x="14" y="22" font-size="12.5" font-weight="800" fill="#b91c1c">제목 없는 프로젝트(안전하지 않음)로 이동</text>
      </g>

      <!-- Allow Button -->
      <g transform="translate(360, 316)">
        <rect width="104" height="40" rx="8" fill="#0f9d58" filter="url(#shadow)"/>
        <text x="52" y="25" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">허용 (Allow)</text>
      </g>
    </g>

    <!-- Callout 1: Advanced -->
    <g transform="translate(420, 196)" filter="url(#badgeShadow)">
      <rect width="360" height="40" rx="8" fill="#dc2626"/>
      <polygon points="0,20 -10,25 -10,15" fill="#dc2626"/>
      <text x="180" y="25" text-anchor="middle" class="callout">① [고급] 누른 뒤 ② [안전하지 않음 이동] 클릭!</text>
    </g>

    <!-- Callout 2: Allow -->
    <g transform="translate(560, 340)" filter="url(#badgeShadow)">
      <rect width="210" height="34" rx="6" fill="#059669"/>
      <polygon points="0,17 -10,22 -10,12" fill="#059669"/>
      <text x="105" y="22" text-anchor="middle" class="callout">③ 마지막 [허용] 클릭!</text>
    </g>
  </g>
</svg>